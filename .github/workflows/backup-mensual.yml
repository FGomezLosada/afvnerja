name: Copia de seguridad mensual

on:
  schedule:
    - cron: '0 5 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente de PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Volcar la base de datos
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Falta el secreto SUPABASE_DB_URL" >&2
            exit 1
          fi
          FECHA=$(date -u +%Y-%m-%d)
          mkdir -p backup
          pg_dump "$SUPABASE_DB_URL" \
            --schema=public --no-owner --no-privileges --schema-only \
            > backup/esquema-$FECHA.sql
          pg_dump "$SUPABASE_DB_URL" \
            --schema=public --no-owner --no-privileges \
            --data-only --column-inserts \
            > backup/datos-$FECHA.sql
          test -s backup/datos-$FECHA.sql
          gzip backup/*.sql
          ls -lh backup

      - name: Guardar la copia
        uses: actions/upload-artifact@v4
        with:
          name: copia-supabase-${{ github.run_id }}
          path: backup/
          retention-days: 90
          if-no-files-found: error
